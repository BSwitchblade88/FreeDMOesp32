# =============================================================================
# FreeDMO label emulator - ESP32-S2 mini build
# =============================================================================
# This version does ONE thing: it emulates a D.MO label roll's RFID data
# over I2C so the printer thinks a genuine roll is loaded. It does NOT read
# real tags - it's a permanent, always-on emulation, selectable by size
# through a dropdown in the ESPHome web UI / Home Assistant.
#
# CHIP NOTE: the ESP32-S2 is a single-core chip (unlike the S3, which has
# two). The I2C slave task in dmo_label_emulator.cpp is pinned to core 0
# accordingly - see the note there if you ever port this to a dual-core chip.
#
# WIRING: only one I2C bus is needed. Update the pin numbers below to match
# your wiring, and double-check they're valid GPIOs on your specific S2 mini
# board (avoid strapping pins GPIO0/45/46, and anything reserved for
# SPI flash on your board's pinout diagram).
# =============================================================================

esphome:
  name: dmo-label-emulator
  friendly_name: DMO Label Emulator

external_components:
  - source:
      type: local
      path: components

esp32:
  board: lolin_s2_mini
  framework:
    # esp-idf is required (not Arduino) - our component talks directly to
    # the ESP-IDF I2C driver in slave mode.
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  platform: esphome

web_server:
  port: 80

logger:
  level: INFO

# --- The emulator itself: I2C slave + tag data, no dropdown logic here ---
dmo_label_emulator:
  id: label_emu
  slave_sda_pin: GPIO8    # mainboard I2C data line
  slave_scl_pin: GPIO9    # mainboard I2C clock line
  slave_address: 0x28     # matches the real CLRC688 reader chip's address
  irq_pin: GPIO12          # tells the mainboard "data ready", part of the protocol

# --- The dropdown: plain ESPHome template select, no custom C++ needed ---
# `restore_value: true` means the choice survives a reboot automatically -
# ESPHome handles that for us, so the C++ side doesn't need to.
select:
  - platform: template
    name: "Sticker Size"
    id: sticker_size_select
    optimistic: true
    restore_value: true
    options:
      - "S0722550 (19x51mm)"
      - "1738541 (25x54mm)"
      - "S0722430 (54x101mm)"
      - "1744907 (104x159mm)"
    initial_option: "S0722550 (19x51mm)"
    on_value:
      then:
        - lambda: |-
            // Match the chosen label back to an index in the emulator's
            // SKU table (see SKU_TABLE in dmo_label_emulator.h) and switch
            // the active label data. Order here must match SKU_TABLE order.
            if (x == "S0722550 (19x51mm)") {
              id(label_emu).set_sku(0);
            } else if (x == "1738541 (25x54mm)") {
              id(label_emu).set_sku(1);
            } else if (x == "S0722430 (54x101mm)") {
              id(label_emu).set_sku(2);
            } else if (x == "1744907 (104x159mm)") {
              id(label_emu).set_sku(3);
            }
